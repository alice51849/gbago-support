律獲授權使用的檔案。</p><p><a href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p></details><details id="hr" lang="hr" dir="ltr"><summary>Hrvatski</summary><h2>GBAGo: Vizualna spremanja</h2><h3>Pravila privatnosti</h3><p>GBAGo radi u potpunosti na vašem uređaju. Bez računa, bez oglasa, bez praćenja, bez prikupljanja podataka.</p><p>Kada je iCloud uključen, GBAGo putem vašeg privatnog iCloud računa sinkronizira spremljena stanja, minijature i .sav baterijska spremanja. Razvojni programer ne prima te podatke.</p><p>Lokalni podaci ostaju dok ih ne izbrišete u GBAGo-u ili uklonite aplikaciju. Isključivanje GBAGo-a u Apple račun &gt; iCloud zaustavlja buduću sinkronizaciju; postojeće iCloud kopije brišu se zasebno u GBAGo-u ili postavkama iCloud pohrane. Izvoz i Dijeljenje šalju samo datoteke koje izričito odaberete na odredište koje odaberete.</p><h3>Pravne informacije</h3><p>GBAGo ne sadrži igre ni katalog sadržaja. Iz aplikacije Datoteke uvezite samo datoteke koje ste sami izradili ili ih smijete koristiti prema važećem zakonu.</p><p>GBAGo je nezavisna aplikacija. Nije povezana s tvrtkom Nintendo Co., Ltd. niti je ona podržava ili sponzorira. Game Boy, Game Boy Color i Game Boy Advance zaštitni su znakovi tvrtke Nintendo i ovdje se koriste isključivo za opis kompatibilnosti datoteka. GBAGo ne sadrži nijednu igru i ne nudi datoteke igara niti vodi do njih.</p><h3>Uvezi igru</h3><p>GBAGo ne sadrži igre ni katalog sadržaja. Iz aplikacije Datoteke uvezite samo datoteke koje ste sami izradili ili ih smijete koristiti prema važećem zakonu.</p><p><a href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p></details><details id="cs" lang="cs" dir="ltr"><summary>Čeština</summary><h2>GBAGo: Vizuální uložené</h2><h3>Zásady ochrany soukromí</h3><p>GBAGo běží zcela na vašem zařízení. Žádné účty, žádné reklamy, žádné sledování, žádný sběr dat.</p><p>Když zapnete iCloud, GBAGo přes váš soukromý účet iCloud synchronizuje uložené stavy, miniatury a bateriové uložené poz
